
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROOMX 3D Scanner</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080a10;color:white;font-family:Arial,sans-serif}
header{padding:16px;background:#111522;border-bottom:1px solid #ff2348;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:23px;font-weight:bold;letter-spacing:3px}.logo span{color:#ff2348}
main{padding:12px;max-width:1200px;margin:auto}
.panel{background:#111522;border:1px solid #292f40;border-radius:12px;padding:15px;margin-bottom:12px}
h2{font-size:17px;margin-top:0}
button,select{width:100%;padding:13px;margin:5px 0;background:#1b2030;color:white;border:1px solid #444b60;border-radius:9px;font-size:14px;cursor:pointer}
button:active{background:#ff2348}
button.primary{background:#ff2348;border-color:#ff2348;font-weight:bold}
button:disabled{opacity:.45;cursor:not-allowed}
#cameraBox{position:relative;width:100%;aspect-ratio:4/3;background:#03050a;overflow:hidden;border-radius:10px}
#video{width:100%;height:100%;object-fit:cover;display:none}
#placeholder{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#aeb7c8}
#scanline{position:absolute;display:none;left:0;right:0;height:3px;background:#ff2348;box-shadow:0 0 20px red;animation:scan 1.5s linear infinite}
.scanning #scanline{display:block}
@keyframes scan{from{top:0}to{top:100%}}
#progress{height:6px;background:#292e3a;border-radius:10px;margin:10px 0;overflow:hidden}
#bar{height:100%;width:0;background:#ff2348;transition:width .15s}
#viewer{height:55vh;min-height:330px;position:relative;background:#070a12;border:1px solid #33394b;border-radius:12px;overflow:hidden}
#threeRoot{position:absolute;inset:0}
#threeRoot canvas{display:block;width:100%;height:100%}
#empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#abb4c5;pointer-events:none}
#empty b{font-size:55px;color:#ff2348}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}
.small{font-size:12px;color:#b1bacb;line-height:1.5}
#message{min-height:35px;font-size:13px;color:#ff6b83}
@media(min-width:800px){main{display:grid;grid-template-columns:300px 1fr;gap:12px;max-width:1400px}.left{grid-column:1}.right{grid-column:2;grid-row:1 / span 2}}
</style>
</head>
<body>
<header>
 <div class="logo">ROOM<span>X</span></div>
 <div id="status">BEREIT</div>
</header>

<main>
<div class="left panel">
<h2>1. Raum auswählen</h2>
<select id="room">
 <option value="gaming">Gaming-Zimmer</option>
 <option value="living">Wohnzimmer</option>
 <option value="bedroom">Schlafzimmer</option>
 <option value="office">Büro</option>
 <option value="empty">Leerer Raum</option>
</select>

<h2>2. Kamera</h2>
<div id="cameraBox">
 <video id="video" autoplay muted playsinline></video>
 <div id="placeholder">◎<br>Kamera noch aus</div>
 <div id="scanline"></div>
</div>
<div id="progress"><div id="bar"></div></div>
<div id="message">Bereit. Starte zuerst die Kamera.</div>

<button class="primary" id="cameraBtn">Kamera starten</button>
<button id="scanBtn">Raum scannen</button>
<button id="stopBtn">Kamera stoppen</button>

<p class="small">Kamerazugriff funktioniert normalerweise nur über HTTPS oder localhost.</p>
</div>

<div class="right">
<div class="panel">
<h2>3. Interaktive 3D-Ansicht</h2>
<div id="viewer">
 <div id="threeRoot"></div>
 <div id="empty"><div><b>⬡</b><p>Starte den Scan für dein 3D-Zimmer.</p></div></div>
</div>
<div class="toolbar">
 <button id="rotateBtn">Rotation: AN</button>
 <button id="snakeBtn">Snake starten</button>
 <button id="lightBtn">Licht aus</button>
 <button id="rebuildBtn">Raum aktualisieren</button>
</div>
</div>
<div class="panel">
<h2>4. Scan-Ergebnis</h2>
<p id="details" class="small">Noch kein 3D-Raum erstellt.</p>
</div>
</div>
</main>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";
import {OrbitControls} from
"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js";

const $=id=>document.getElementById(id);
const video=$("video");
let stream=null,scanTimer=null,progress=0,completed=false;
let scene,camera,renderer,controls,group;
let rotating=true,lightsOn=true,snakeActive=false,snake=null,clock=0;
let objectCount=0;

function say(text){$("message").textContent=text}
function status(text){$("status").textContent=text}

$("cameraBtn").addEventListener("click",startCamera);
$("scanBtn").addEventListener("click",startScan);
$("stopBtn").addEventListener("click",stopCamera);
$("rotateBtn").addEventListener("click",()=>{
 rotating=!rotating;
 $("rotateBtn").textContent=rotating?"Rotation: AN":"Rotation: AUS";
});
$("snakeBtn").addEventListener("click",toggleSnake);
$("lightBtn").addEventListener("click",toggleLights);
$("rebuildBtn").addEventListener("click",()=>{
 if(!completed){say("Bitte erst den Scan beenden.");return}
 createRoom();
 say("Raum wurde aktualisiert.");
});
$("room").addEventListener("change",()=>{
 if(completed)createRoom();
});

async function startCamera(){
 try{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
   throw new Error("Kamera braucht HTTPS und einen unterstützten Browser.");

  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:{ideal:"environment"}},
   audio:false
  });

  video.srcObject=stream;
  await video.play();
  video.style.display="block";
  $("placeholder").style.display="none";
  $("cameraBtn").textContent="Kamera aktiv";
  status("KAMERA AKTIV");
  say("Kamera läuft. Richte sie auf deinen Raum.");
 }catch(e){
  say("Kamerafehler: "+e.message);
 }
}

function stopCamera(){
 if(stream){
  stream.getTracks().forEach(t=>t.stop());
  stream=null;
 }
 video.srcObject=null;
 video.style.display="none";
 $("placeholder").style.display="grid";
 $("cameraBtn").textContent="Kamera starten";
 status("KAMERA AUS");
 say("Kamera gestoppt. Ein bereits erstelltes 3D-Modell bleibt sichtbar.");
}

function startScan(){
 if(!stream){say("Bitte zuerst Kamera starten.");return}
 clearInterval(scanTimer);
 progress=0;
 completed=false;
 $("bar").style.width="0%";
 $("scanBtn").disabled=true;
 $("cameraBox").classList.add("scanning");
 $("empty").style.display="grid";
 status("SCAN LÄUFT");

 scanTimer=setInterval(()=>{
  progress=Math.min(100,progress+2);
  $("bar").style.width=progress+"%";
  say("Scan-Fortschritt: "+progress+"%");

  if(progress>=100){
   clearInterval(scanTimer);
   scanTimer=null;
   completed=true;
   $("scanBtn").disabled=false;
   $("cameraBox").classList.remove("scanning");
   createRoom();
   $("empty").style.display="none";
   status("3D BEREIT");
   say("Scan abgeschlossen. Beispiel-3D-Raum erstellt.");
  }
 },100);
}

function init3D(){
 if(renderer)return;

 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x080a12);
 camera=new THREE.PerspectiveCamera(55,1,.1,100);
 camera.position.set(7,5,8);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 $("threeRoot").appendChild(renderer.domElement);

 controls=new OrbitControls(camera,renderer.domElement);
 controls.enableDamping=true;
 controls.target.set(0,1,0);

 const ambient=new THREE.HemisphereLight(0xffffff,0x303044,2);
 scene.add(ambient);

 const light=new THREE.DirectionalLight(0xffffff,3);
 light.position.set(5,8,6);
 scene.add(light);

 group=new THREE.Group();
 scene.add(group);

 scene.add(new THREE.GridHelper(20,40,0xff2348,0x303342));
 window.addEventListener("resize",resize3D);
 resize3D();
 animate();
}

function resize3D(){
 if(!renderer)return;
 const w=Math.max($("threeRoot").clientWidth,1);
 const h=Math.max($("threeRoot").clientHeight,1);
 renderer.setSize(w,h,false);
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
}

function addBox(name,x,y,z,sx,sy,sz,color){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(sx,sy,sz),
  new THREE.MeshStandardMaterial({color,roughness:.75})
 );
 mesh.name=name;
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 group.add(mesh);
 objectCount++;
}

function createRoom(){
 init3D();

 while(group.children.length){
  const child=group.children[0];
  group.remove(child);
  child.geometry?.dispose();
  if(child.material){
   if(Array.isArray(child.material))child.material.forEach(m=>m.dispose());
   else child.material.dispose();
  }
 }
 objectCount=0;
 snake=null;
 snakeActive=false;
 $("snakeBtn").textContent="Snake starten";

 const type=$("room").value;

 addBox("Boden",0,-.12,0,8,.2,7,0x303440);
 addBox("Rückwand",0,1.6,-3.5,8,3.2,.12,0x252b39);
 addBox("Linke Wand",-4,1.6,0,.12,3.2,7,0x1b202b);
 addBox("Rechte Wand",4,1.6,0,.12,3.2,7,0x1b202b);
 addBox("Fenster",-1.5,2,-3.4,1.6,1.2,.08,0x23425f);
 addBox("Tür",3,1,-3.4,.9,2,.08,0x79523b);

 if(type==="gaming"){
  addBox("Tisch",0,.8,-2,2.8,.12,.9,0x171b26);
  addBox("Monitor",0,1.5,-2.4,1.3,.8,.1,0x163b5b);
  addBox("Zweiter Monitor",1.3,1.5,-2.4,1,.8,.1,0x401b3a);
  addBox("Gaming-PC",2,.6,-1.6,.5,1,.6,0x252b40);
  addBox("Stuhl",0,.7,-.6,.8,.8,.8,0x8e1535);
 }
 if(type==="living"){
  addBox("Sofa",0,.65,-2,2.8,1,1,0x6c7888);
  addBox("Couchtisch",0,.4,0,1.6,.12,.9,0x79553c);
  addBox("Fernseher",2,1.4,-3.3,1.8,1,.1,0x11151e);
 }
 if(type==="bedroom"){
  addBox("Bett",0,.4,-1.4,2.2,.6,3,0xe4e4eb);
  addBox("Kissen",-.5,.8,-2.5,.8,.15,.5,0xb7b9c6);
  addBox("Schrank",-3,1.2,-1,.9,2.4,1.2,0x8b735e);
 }
 if(type==="office"){
  addBox("Schreibtisch",0,.8,-2,2.5,.12,1,0x71523d);
  addBox("Bürostuhl",0,.7,-.5,.8,1,.8,0x313948);
  addBox("Regal",-3,1.2,-2,1,2.4,.6,0x805a40);
 }
 if(type!=="empty")addBox("Teppich",0,.02,.4,3,.03,2,0x48404b);

 camera.position.set(7,5,8);
 controls.target.set(0,1,0);
 controls.update();

 $("empty").style.display="none";
 $("details").textContent="Raumtyp: "+$("room").selectedOptions[0].text+
 ". Beispielmodell mit "+objectCount+" 3D-Objekten.";
}

function toggleLights(){
 if(!scene)return say("Erstelle zuerst den 3D-Raum.");
 lightsOn=!lightsOn;
 scene.traverse(o=>{if(o.isLight)o.visible=lightsOn});
 $("lightBtn").textContent=lightsOn?"Licht aus":"Licht an";
}

function toggleSnake(){
 if(!completed)return say("Bitte zuerst den Scan abschließen.");
 init3D();

 if(snakeActive){
  snakeActive=false;
  if(snake)group.remove(snake);
  snake=null;
  $("snakeBtn").textContent="Snake starten";
  say("Snake gestoppt.");
  return;
 }

 snake=new THREE.Group();
 const material=new THREE.MeshStandardMaterial({color:0xff2348});
 for(let i=0;i<8;i++){
  const part=new THREE.Mesh(new THREE.SphereGeometry(.13,12,12),material);
  part.userData.index=i;
  snake.add(part);
 }
 group.add(snake);
 snakeActive=true;
 clock=0;
 $("snakeBtn").textContent="Snake stoppen";
 say("Snake läuft durch den 3D-Raum.");
}

function animate(){
 requestAnimationFrame(animate);
 if(controls){
  if(rotating&&!snakeActive)
   camera.position.applyAxisAngle(new THREE.Vector3(0,1,0),.0007);
  controls.update();
 }
 if(snakeActive&&snake){
  clock+=.025;
  snake.children.forEach((part,i)=>{
   const t=clock-i*.22;
   part.position.set(Math.sin(t)*2.5,.25,Math.cos(t)*2);
  });
 }
 if(renderer)renderer.render(scene,camera);
}
</script>
</body>
</html>
